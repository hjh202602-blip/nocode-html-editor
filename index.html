<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록 웹 편집기</title>
<link rel="stylesheet" href="css/app.css?v=28">
</head>
<body>
<div id="app">
  <!-- 1: 프로젝트 (Ctrl+B 로 옆으로 밀어 넣기 · 꺼내기) -->
  <aside id="tab1" class="panel">
    <div class="panel-head">
      <span class="panel-title">프로젝트</span>
      <div class="head-actions" id="ex-actions"></div>
    </div>
    <div class="ex-root" id="ex-root"></div>
    <div class="ex-tree" id="ex-tree" tabindex="0"></div>
  </aside>
  <div class="splitter sv" data-split="w1" style="grid-area:s1" title="끌어서 크기 조절 · 두 번 클릭하면 접기/펴기 (Ctrl+B)"></div>

  <!-- 2: 메인 작업 공간 (HTML) -->
  <main id="tab3" class="panel">
    <div class="doc-bar">
      <button class="icon-btn side-btn" id="btn-side1" title="프로젝트 탭 열기/닫기 (Ctrl+B)"></button>
      <div class="doc-tabs" id="doc-tabs"></div>
      <div class="doc-tools" id="doc-tools"></div>
    </div>
    <div class="doc-body">
      <div class="canvas-scroll" id="canvas-scroll">
        <div class="canvas-frame" id="canvas-frame"><div id="canvas-host"></div></div>
        <div class="drop-line" id="drop-line" hidden></div>
        <div class="sel-toolbar" id="sel-toolbar" hidden></div>
      </div>
      <textarea class="text-editor" id="text-editor" spellcheck="false" hidden></textarea>
      <div class="image-view" id="image-view" hidden><img alt=""></div>
      <div class="empty-view" id="empty-view" hidden></div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
  </main>
  <div class="splitter sv" data-split="w5" style="grid-area:s5" title="끌어서 크기 조절 · 두 번 클릭하면 접기/펴기 (Ctrl+J)"></div>

  <div id="side">
    <!-- 3: 설정 -->
    <div id="tab-set" class="panel">
      <button class="btn small" id="btn-settings"></button>
      <button class="btn small primary" id="btn-convert"></button>
      <button class="icon-btn" id="btn-theme" title="밝게 / 어둡게"></button>
    </div>

    <!-- 4: 도구 — HTML 태그 · CSS 디자인 · JS 동작 (Ctrl+1 / 2 / 3) -->
    <section id="tools" class="panel">
      <div class="tools-head">
        <div class="seg tool-mode">
          <button data-tm="html" title="HTML 태그 — 요소 넣기 · 형식 · 구조 (Ctrl+1)"><b>HTML</b><span>태그</span></button>
          <button data-tm="css" title="CSS 디자인 — 고른 요소 꾸미기 (Ctrl+2)"><b>CSS</b><span>디자인</span></button>
          <button data-tm="js" title="JS 동작 — 블록 · 코드 (Ctrl+3)"><b>JS</b><span>동작</span></button>
        </div>
      </div>
      <section id="tab4" class="panel tool-pane" data-pane="html"></section>
      <div id="tab2" class="panel tool-pane" data-pane="css" hidden><div class="inspector" id="inspector"></div></div>
      <aside id="tab5" class="panel tool-pane" data-pane="js" hidden></aside>
    </section>
  </div>
</div>

<div id="modal-root"></div>
<div class="ctx-menu" id="ctx-menu" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-picker" hidden>

<script src="js/core.js?v=28"></script>
<script src="js/effects.js?v=28"></script>
<script src="js/blockcode.js?v=28"></script>
<script src="js/codegen.js?v=28"></script>
<script src="js/palette.js?v=28"></script>
<script src="js/canvas.js?v=28"></script>
<script src="js/inspector.js?v=28"></script>
<script src="js/formats.js?v=28"></script>
<script src="js/repeater.js?v=28"></script>
<script src="js/vfs.js?v=28"></script>
<script src="js/explorer.js?v=28"></script>
<script src="js/blocks.js?v=28"></script>
<script src="js/app.js?v=28"></script>
</body>
</html>
