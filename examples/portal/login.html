<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모아 로그인 - 연습용</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 60px 20px;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background-color: #f4f4f8;
    }
    .c1 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .c2 {
      color: #4f46e5;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0;
    }
    .c3 {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 420px;
      background-color: #ffffff;
      padding: 28px 24px 24px;
      border-width: 1px;
      border-style: solid;
      border-color: #e2e2ea;
      border-radius: 16px;
    }
    .c4 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .c8 {
      padding: 14px;
      font-size: 16px;
      border-width: 1px;
      border-style: solid;
      border-color: #d6d6e0;
      border-radius: 10px;
    }
    .c9 {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #555566;
    }
    .c10 {
      height: 50px;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      border-style: none;
      border-radius: 10px;
      margin: 6px 0 0;
    }
    .c11 {
      margin: 0;
      font-size: 12px;
      color: #9999a8;
      text-align: center;
    }
    .c12 {
      display: flex;
      flex-direction: row;
      gap: 12px;
      font-size: 14px;
      color: #666677;
    }
    .c13 {
      color: #cccccc;
    }
    .c14 {
      color: #4f46e5;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="c1">
    <h1 class="c2">MOA</h1>
    <div class="c3">
      <h2 class="c4">로그인</h2>
      <input class="c8" type="text" placeholder="아이디">
      <input class="c8" type="password" placeholder="비밀번호">
      <div class="c9">
        <input type="checkbox">
        <label>로그인 상태 유지</label>
      </div>
      <button class="c10" type="button">로그인</button>
      <p class="c11">연습용 화면이에요. 입력한 정보는 어디에도 보내지지 않아요.</p>
    </div>
    <div class="c12">
      <span>비밀번호 찾기</span>
      <span class="c13">|</span>
      <span>아이디 찾기</span>
      <span class="c13">|</span>
      <span>회원가입</span>
    </div>
    <a class="c14" href="index.html">← 첫 화면으로</a>
  </div>
</body>
</html>
